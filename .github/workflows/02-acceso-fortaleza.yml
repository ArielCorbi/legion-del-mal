name: Acceso a la Fortaleza Prohibida

on: push

jobs: 
    acceso-a-la-base:
        runs-on: ubuntu-latest

        steps:
            - name: El agente llega a la Fortaleza
              run: |
                echo "Agente ${{ github.actor}} llega a la fortaleza"
                echo ""
                echo "Buscar los archivos de la legion"
                ls -la
                echo ""
                echo "x pero qué pasó? no hay nada"

            - name: 'Brainiac desbloquea la bóveda'
              uses: actions/checkout@v4

            - name: 'Ahora si, vamos a ver los planes'
              run: |
                echo "Buscar los archivos de la legion"
                ls -la
                echo "Funcionan !!"
                echo ""
                echo "Planes: "
                ls planes/
                echo "Villanos: "
                ls miembros/
                echo "Inteligencia: "
                ls inteligencia/