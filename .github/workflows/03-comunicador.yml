name: Comunicador de la Legión del Mal

on:
  workflow_dispatch:
    inputs:
      villano: 
        description: "¿Qué villano envía el mensaje?"
        required: true
        type: choice
        options:
          - Lex luthor
          - Brainiac
          - Darkseid
          - Joker
          - Reverse Flash

jobs:
  transmitir-mensaje:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

