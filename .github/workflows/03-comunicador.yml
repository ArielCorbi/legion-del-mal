name: Comunicador de la Legión del Mal

on:
  workflow_dispatch:
    inputs:
      villano: 
        description: '¿Qué villano envía el mensaje?'
        required: true
        type: choice
        options:
          - Lex luthor
          - Brainiac
          - Darkseid
          - Joker
          - Reverse Flash
      mensaje: 
        description: 'Mensaje para el consejo'
        required: true
        default: "La mision fue un éxito"

      Prioridad: 
        description: 'Nivel de prioridad'
        required: true
        type: choice
        options:
          - Normal
          - Alta
          - Crítica

jobs:
  transmitir-mensaje:
    runs-on: ubuntu-latest

    steps:
      - name: Imprimir inputs
        run: |
          echo "Inpuuts: "
          echo ""
          echo "Villanos: ${{ inputs.villano }}"
          echo "Nivel: ${{ inputs.prioridad }}"
          echo "Mensaje: ${{ inputs.mensaje }}"

